<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Runner</title>
<style>
:root{--bg:#1b1d2a;--fg:#f4f1de;--btn:#3d405b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8eefc;--fg:#1d2140;--btn:#b9c4ec}}
:root[data-theme="dark"]{--bg:#1b1d2a;--fg:#f4f1de;--btn:#3d405b}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{width:min(96vw,960px);aspect-ratio:320/192;image-rendering:pixelated;border:3px solid var(--fg);border-radius:4px;background:#5c94fc}
.pad{display:flex;gap:10px;width:min(96vw,960px);justify-content:space-between}
.pad div{display:flex;gap:10px}
.pad button{background:var(--btn);color:var(--fg);border:2px solid var(--fg);border-radius:8px;font:bold 22px monospace;width:72px;height:56px;touch-action:none}
.pad button.j{width:120px}
small{opacity:.7}
</style></head><body>
<canvas id="c" width="320" height="192"></canvas>
<div class="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><button id="bj" class="j">SKOK</button></div>
<small>← → / A D – ruch · Spacja / W / ↑ – skok · Wskocz na wrogów, zbierz monety, dotknij flagi!</small>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),T=16,W=320,H=192;
const keys={};let jumpHeld=false;
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(state!=='play')startKey()});
addEventListener('keyup',e=>keys[e.code]=0);
const touch={l:0,r:0,j:0};
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=1;if(state!=='play')startKey()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=0));});
cv.addEventListener('pointerdown',()=>{if(state!=='play')startKey()});
let AC;function beep(f,d,t='square'){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

const LV=[
 {w:60,pits:[[22,3],[40,3]],it:[[10,7,'B?B'],[14,4,'CCC'],[26,7,'BBB?B'],[30,4,'CCC'],[46,7,'?B?'],[20,5,'CC'],[38,6,'CC']],en:[16,28,36,50]},
 {w:80,pits:[[15,3],[28,4],[44,3],[58,5]],it:[[8,7,'?B?'],[12,5,'CCC'],[29,6,'BB'],[34,9,'###'],[35,8,'##'],[36,7,'#'],[48,7,'BBB?'],[60,7,'BB'],[60,5,'CC'],[70,7,'?B?']],en:[20,32,40,50,66,72]},
 {w:100,pits:[[12,3],[24,4],[36,4],[50,5],[66,4],[80,3]],it:[[18,9,'^^'],[44,9,'^^^'],[72,9,'^^'],[52,7,'BB'],[52,5,'CC'],[8,7,'?B?'],[28,7,'B?B'],[40,5,'CCC'],[60,7,'?'],[76,6,'BBB'],[88,9,'###'],[89,8,'##'],[90,7,'#'],[56,9,'^'],[84,5,'CCC']],en:[16,30,42,48,58,62,70,78,86]}
];
let g,lw,lv=0,p,en,cam,score=0,lives=3,coins=0,state='title',timer=0,tick=0;
function load(i){const L=LV[i];lw=L.w;g=[];for(let r=0;r<12;r++){g.push(Array(lw).fill(' '))}
 for(let c=0;c<lw;c++){g[10][c]=g[11][c]='#'}
 L.pits.forEach(([s,n])=>{for(let c=s;c<s+n;c++)g[10][c]=g[11][c]=' '});
 L.it.forEach(([c,r,s])=>[...s].forEach((ch,k)=>g[r][c+k]=ch));
 for(let r=5;r<10;r++)g[r][lw-4]='F';
 en=L.en.map(c=>({x:c*T+1,y:9*T+2,vx:-.5,dead:0,t:0}));
 p={x:T*2,y:9*T,vx:0,vy:0,w:12,h:14,face:1,gnd:0,coy:0};cam=0}
const solid=(c,r)=>c<0||c>=lw?true:(r<0||r>=12?false:'#B?U'.includes(g[r][c]));
function die(){if(state!=='play')return;lives--;state='dead';timer=90;p.vy=-5;beep(150,.5,'sawtooth')}
function startKey(){if(state==='title'||state==='over'||state==='win'){lv=0;score=0;lives=3;coins=0;load(0);state='play'}}
function step(){tick++;
 if(state==='dead'){p.vy+=.35;p.y+=p.vy;if(--timer<=0){if(lives<=0)state='over';else{load(lv);state='play'}}return}
 if(state==='clear'){if(--timer<=0){lv++;if(lv>=LV.length)state='win';else{load(lv);state='play'}}return}
 if(state!=='play')return;
 const L=keys.ArrowLeft||keys.KeyA||touch.l,R=keys.ArrowRight||keys.KeyD||touch.r,J=keys.Space||keys.ArrowUp||keys.KeyW||touch.j;
 const acc=p.gnd?.2:.12;
 if(L){p.vx-=acc;p.face=-1}if(R){p.vx+=acc;p.face=1}
 if(!L&&!R)p.vx*=p.gnd?.8:.95;
 p.vx=Math.max(-2,Math.min(2,p.vx));if(Math.abs(p.vx)<.03)p.vx=0;
 if(p.gnd)p.coy=6;else p.coy--;
 if(J&&!jumpHeld&&p.coy>0){p.vy=-6.7;p.coy=0;p.gnd=0;beep(520,.12)}
 if(!J&&p.vy<-2.5)p.vy=-2.5;
 jumpHeld=!!J;
 p.vy=Math.min(p.vy+.35,8);
 // X
 p.x+=p.vx;let r0=Math.floor(p.y/T),r1=Math.floor((p.y+p.h-1)/T);
 if(p.vx>0){const c=Math.floor((p.x+p.w)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){p.x=c*T-p.w;p.vx=0;break}}
 else if(p.vx<0){const c=Math.floor(p.x/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){p.x=(c+1)*T;p.vx=0;break}}
 // Y
 p.y+=p.vy;p.gnd=0;const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-1)/T);
 if(p.vy>=0){const r=Math.floor((p.y+p.h)/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){p.y=r*T-p.h;p.vy=0;p.gnd=1;break}}
 else{const r=Math.floor(p.y/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){p.y=(r+1)*T;p.vy=0;if(g[r][c]==='?'){g[r][c]='U';score+=200;coins++;beep(900,.15)}else beep(120,.06);break}}
 if(p.y>H+10){die();return}
 // przedmioty
 for(let r=Math.floor(p.y/T);r<=Math.floor((p.y+p.h-1)/T);r++)for(let c=c0;c<=c1;c++){const t=g[r]&&g[r][c];
  if(t==='C'){g[r][c]=' ';coins++;score+=100;beep(1100,.1)}
  else if(t==='^'&&p.y+p.h>r*T+8){die();return}
  else if(t==='F'){state='clear';timer=120;score+=1000;beep(660,.4);return}}
 // wrogowie
 for(const e of en){if(e.dead){e.t++;continue}
  e.x+=e.vx;const ahead=e.vx<0?Math.floor(e.x/T):Math.floor((e.x+14)/T);
  if(solid(ahead,9)||!solid(ahead,10)||g[9][ahead]==='^')e.vx*=-1;
  if(p.x<e.x+14&&p.x+p.w>e.x&&p.y<e.y+14&&p.y+p.h>e.y){
   if(p.vy>0&&p.y+p.h-e.y<10){e.dead=1;p.vy=-4.5;score+=100;beep(300,.12)}else{die();return}}}
 cam=Math.max(0,Math.min(lw*T-W,p.x+6-W/2));
}
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
function draw(){
 R('#5c94fc',0,0,W,H);
 for(let i=0;i<6;i++){const x=((i*90-cam*.3)%(W+60)+W+60)%(W+60)-30,y=20+(i%3)*22;R('#fff',x,y,28,8);R('#fff',x+6,y-5,16,6)}
 for(let i=0;i<5;i++){const x=((i*110-cam*.5)%(W+80)+W+80)%(W+80)-40;R('#3a9a4a',x,H-32-14,40,14);R('#2f8040',x+8,H-32-24,24,10)}
 ctx.save();ctx.translate(-Math.round(cam),0);
 const c0=Math.floor(cam/T),c1=c0+Math.ceil(W/T)+1;
 for(let r=0;r<12;r++)for(let c=c0;c<=Math.min(c1,lw-1);c++){const t=g[r][c],x=c*T,y=r*T;
  if(t==='#'){R('#a0522d',x,y,T,T);R('#7a3b1d',x,y+7,T,1);R('#7a3b1d',x+7,y,1,7);R('#7a3b1d',x+3,y+8,1,8);if(g[r-1]&&g[r-1][c]!=='#')R('#4caf50',x,y,T,4)}
  else if(t==='B'){R('#c8642c',x,y,T,T);R('#6b2d0f',x,y+5,T,1);R('#6b2d0f',x,y+10,T,1);R('#6b2d0f',x+8,y,1,5);R('#6b2d0f',x+4,y+5,1,5);R('#6b2d0f',x+12,y+10,1,6)}
  else if(t==='?'){R('#f9c22e',x,y,T,T);R('#8a5a00',x,y,T,1);R('#8a5a00',x,y+15,T,1);R('#fff',x+6,y+3,4,2);R('#fff',x+9,y+5,2,3);R('#fff',x+7,y+8,2,2);R('#fff',x+7,y+11,2,2)}
  else if(t==='U'){R('#7a5a3a',x,y,T,T);R('#4a3420',x+2,y+2,12,12)}
  else if(t==='^'){for(let k=0;k<2;k++){R('#ddd',x+k*8+3,y+8,2,8);R('#ddd',x+k*8+2,y+10,4,6);R('#999',x+k*8+1,y+13,6,3)}}
  else if(t==='C'){const b=Math.sin((tick+c*9)/12)*2;R('#ffd700',x+5,y+3+b,6,10);R('#fff6a0',x+7,y+5+b,2,6)}
  else if(t==='F'){R('#ddd',x+7,y,2,T);if(g[r-1][c]!=='F'){R('#e63946',x+9,y+1,7,5);R('#e63946',x+9,y+3,10,2)}}}
 for(const e of en){const x=e.x,y=e.y;if(e.dead){if(e.t<30){R('#8b4513',x,y+10,14,4);R('#000',x+3,y+10,2,2);R('#000',x+9,y+10,2,2)}continue}
  const f=Math.floor(tick/10)%2;R('#8b4513',x+1,y,12,9);R('#a0522d',x,y+2,14,6);R('#f5deb3',x+2,y+7,10,4);R('#fff',x+2,y+3,4,3);R('#fff',x+8,y+3,4,3);R('#000',x+4,y+4,2,2);R('#000',x+8,y+4,2,2);R('#3a1d0a',x+(f?0:2),y+11,5,3);R('#3a1d0a',x+(f?9:7),y+11,5,3)}
 if(!(state==='dead'&&0)){const x=p.x-0,y=p.y,f=p.face,m=Math.abs(p.vx)>.3&&p.gnd?Math.floor(tick/5)%2:0;
  R('#e63946',x+1,y,10,3);R('#e63946',x+(f>0?3:-1),y+2,10,2);R('#f1c27d',x+2,y+4,8,4);R('#000',x+(f>0?7:3),y+5,2,2);
  R('#5b3a1e',x+(f>0?2:6),y+7,4,1);R('#2a5bd7',x+2,y+8,8,4);R('#e63946',x,y+8,2,3);R('#e63946',x+10,y+8,2,3);
  R('#5b3a1e',x+(m?0:2),y+12,5,2);R('#5b3a1e',x+(m?7:5),y+12,5,2)}
 ctx.restore();
 ctx.font='bold 9px monospace';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=0;
 const tx=(s,x,y)=>{ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle='#fff';ctx.fillText(s,x,y)};
 tx('PUNKTY '+String(score).padStart(6,'0'),6,12);tx('● x'+coins,140,12);tx('ŻYCIA '+lives,214,12);tx('POZ '+(lv+1)+'/'+LV.length,270,12);
 const msg=(a,b)=>{R('rgba(0,0,0,.6)'.length?'#000a':'',0,0,0,0);ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,60,W,70);ctx.textAlign='center';ctx.font='bold 20px monospace';tx(a,W/2,92);ctx.font='bold 9px monospace';tx(b,W/2,112);ctx.textAlign='left'};
 if(state==='title')msg('PIXEL RUNNER','Naciśnij dowolny klawisz lub dotknij, aby zacząć');
 if(state==='clear')msg('POZIOM UKOŃCZONY!','+1000 punktów');
 if(state==='over')msg('KONIEC GRY','Wynik: '+score+' · naciśnij, aby zagrać ponownie');
 if(state==='win')msg('WYGRAŁEŚ! 🏆','Wynik końcowy: '+score+' · naciśnij, aby zagrać ponownie');
}
load(0);let last=0,acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
</script></body></html>
